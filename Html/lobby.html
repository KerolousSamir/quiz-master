<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1E36">
  <title>غرفة الانتظار | Church Quiz Lobby</title>
  <link rel="stylesheet" href="lobby.css">
  <!-- مكتبة خفيفة لتوليد الـ QR Code محلياً -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="lobby-screen">
    <!-- الشريط العلوي: كود الدخول والـ PIN والـ QR -->
    <header class="lobby-topbar">
      <div class="join-info-box">
        <span class="info-label">انضم الآن عبر الرابط أو امسح الرمز:</span>
        <strong class="info-url" id="joinUrlText">.../participant.html</strong>
      </div>

      <div class="pin-display-box">
        <span class="pin-label">GAME PIN:</span>
        <span class="pin-code" id="lobbyPinCode">------</span>
      </div>

      <div class="qr-box">
        <div id="qrcode"></div>
      </div>
    </header>

    <!-- شريط التحكم الرئيسي: اسم الاختبار، عدد اللاعبين، وزر البدء -->
    <div class="lobby-action-bar">
      <div class="quiz-badge">
        <span class="badge-icon">📖</span>
        <span id="lobbyQuizTitle">تحميل المسابقة...</span>
      </div>

      <div class="player-counter">
        <span class="count-num" id="playerCount">0</span>
        <span class="count-label">لاعبين انضموا</span>
      </div>

      <button id="startGameBtn" class="start-btn" disabled>
        🚀 بدء المسابقة (Start)
      </button>
    </div>

    <!-- ساحة تجمع اللاعبين المنضمين -->
    <main class="players-arena" id="playersArena">
      <div class="empty-arena-msg" id="emptyMsg">
        في انتظار انضمام الأبطال... امسح الرمز أو اكتب اسمك للدخول! 🎮
      </div>
    </main>
  </div>

  <script src="lobby.js"></script>
</body>
</html>
